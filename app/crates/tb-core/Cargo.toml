[package]
publish = false
name = "tb-core"
description = "ThrustBench core: protocol, device session, safety, recording and analysis. No UI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Linux only: richer USB port information through libudev (needs libudev-dev).
udev = ["serialport/libudev"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
crossbeam-channel = "0.5"
fs2 = "0.4"
log = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
