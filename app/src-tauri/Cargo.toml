[package]
publish = false
name = "thrustbench"
description = "ThrustBench desktop application (Tauri shell around tb-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tb-core = { path = "../crates/tb-core" }
